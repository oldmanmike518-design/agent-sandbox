name: Keep Warm

# Render Free spins a service down after 15 minutes without inbound traffic, and
# the wake-up costs a visitor ~60 seconds. This pings /readyz so links shared in
# public posts land on an already-running service.
#
# The window is deliberate, not round-the-clock: a workspace gets 750 free
# instance hours per calendar month, and 24/7 across a 31-day month is 744 --
# close enough to the cap that a few redeploys suspend the service. 06:00-01:59
# UTC is 20 hours (~620/month), covering European morning through US evening and
# going dark only from 02:00-05:59 UTC.
#
# GitHub disables scheduled workflows after 60 days without repository activity.
# If pings stop, re-enable this workflow from the Actions tab.

on:
  schedule:
    - cron: "*/5 0-1,6-23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping health check
        env:
          BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://agent-sandbox-interop.onrender.com' }}
        run: |
          curl -fsS \
            --max-time 180 \
            --retry 3 \
            --retry-delay 20 \
            --retry-all-errors \
            -o /dev/null \
            -w 'readyz %{http_code} in %{time_total}s\n' \
            "${BASE_URL}/readyz"
